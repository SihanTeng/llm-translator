name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Qt 6.11
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libdbus-1-dev ninja-build

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DTRANSLATOR_VERSION="${GITHUB_REF_NAME#v}"
          cmake --build build

      - name: Build RPM package
        run: |
          sudo apt-get install -y rpm
          cd build && cpack -G RPM && mv translator-*.rpm ../

      - name: Build AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x *.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
              --appdir AppDir \
              -e build/clients/linux-qt/translator \
              -d packaging/translator.desktop \
              -i packaging/translator.png \
              --plugin qt --output appimage
          # linuxdeploy names the output after the desktop entry (capitalized);
          # exclude the downloaded linuxdeploy tools themselves.
          appimage_file=$(ls *.AppImage | grep -v '^linuxdeploy' | head -1)
          mv "$appimage_file" translator-x86_64.AppImage

      - name: Package source tarball
        run: |
          mkdir -p dist/translator
          cp build/clients/linux-qt/translator dist/translator/
          cp -r clients/linux-qt/extension dist/translator/
          cp README.md dist/translator/
          tar -czf translator-linux-x86_64.tar.gz -C dist translator

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            translator-linux-x86_64.tar.gz
            translator-x86_64.AppImage
            translator-*.rpm
          generate_release_notes: true
