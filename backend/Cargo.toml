[package]
name = "translator-backend"
version = "0.1.0"
edition = "2021"
description = "Shared LLM translation backend (providers, streaming clients, prompts, history) for the translator apps"

[lib]
name = "translator_backend"
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
